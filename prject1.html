<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .hero {
        border: 2px solid black;
        border-radius: 15px;
        width: 20%;
        height: 500px;
        position: absolute;
        top: 100px;
        left: 500px;
        background-color: rgb(120, 141, 141);
        box-shadow: 0 0 20px blue;
      }

      h1 {
        text-align: center;
      }
      form {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .container {
        padding-left: 20px;
      }
      #btn {
        padding: 20px 20px;
      }
      button {
        border: 2px solid black;
        position: absolute;
        bottom: 100px;
        left: 70px;
        border-radius: 15px;
      }
      button:hover {
        transform: rotate(10deg);
        background-color: rgb(255, 94, 0);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>login form</h1>
      <form>
        <label for="name">
          Name:
          <input
            placeholder="enter your name"
            type="text"
            style="height: 30px"
          />
        </label>
        <label for="email">
          email:
          <input placeholder="text" name="email" />
        </label>
        <label for="password">
          password:
          <input
            placeholder="enter your password"
            type="password"
            name="password"
            id=""
          />
        </label>
        <label for="mobile number">
          mobile number:
          <input placeholder="enter your mobile number" type="text" />
        </label>

        <label for="gender" class="container">
          Gender: male: <input type="checkbox" name="" id="" /> female:
          <input type="radio" name="" id="" />
        </label>

        <div>
          <label for="DOB" id="btn">
            DOB:
            <input placeholder="DD/MM/YYYY" type="date" name="" id="" />
          </label>
        </div>
        <button>submit</button>
      </form>
    </section>
  </body>
</html>
